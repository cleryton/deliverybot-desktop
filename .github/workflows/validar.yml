name: Validar DeliveryBot

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codigo:
    name: DeliveryBot / codigo e WhatsApp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: whatsapp-native/package-lock.json
      - name: Conferir projeto e sintaxe
        run: |
          python packaging/verificar_projeto.py
          git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Instalar dependencias WhatsApp fixadas
        working-directory: whatsapp-native
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testar WhatsApp sem contas reais
        working-directory: whatsapp-native
        run: npm test
      - name: Testar fisica do minijogo no navegador
        run: node --test tests/js/*.test.cjs

  windows:
    name: DeliveryBot / testes e executavel Windows
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      WHATSAPP_PROVIDER: TESTE
      IA_PROVIDER: ''
      TUNEL_AUTOMATICO: NAO
      SEED_CATALOGO: NAO
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Isolar dados de teste
        run: |
          "DELIVERYBOT_ENV_FILE=$(Join-Path $env:RUNNER_TEMP 'deliverybot-ci.env')" >> $env:GITHUB_ENV
          "DATABASE_PATH=$(Join-Path $env:RUNNER_TEMP 'deliverybot-ci.db')" >> $env:GITHUB_ENV
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.lock.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: whatsapp-native/package-lock.json
      - name: Instalar dependencias fixadas
        run: |
          python -m pip install -r requirements-desktop.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependencias Python.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependencias Python incompativeis.' }
          npm.cmd ci --prefix whatsapp-native --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependencias WhatsApp.' }
      - name: Testar estoque, pedidos, seguranca e documentos
        run: python -m pytest -q --junitxml=artifacts/testes.xml
      - name: Preparar componentes do aplicativo
        run: |
          python packaging/preparar_whatsapp.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar WhatsApp.' }
          python packaging/preparar_tunel.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar conector HTTPS.' }
      - name: Compilar aplicativo e instalador
        run: |
          python -m PyInstaller --noconfirm --distpath dist/ci DeliveryBot.spec
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar aplicativo.' }
          python packaging/criar_instalador.py --distpath dist/ci
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar instalador.' }
          python packaging/distribuicao.py --distpath dist/ci
          if ($LASTEXITCODE -ne 0) { throw 'Distribuição incompleta ou integridade divergente.' }
      - name: Testar perfil de comercio no instalador
        run: |
          $taskCompiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $taskTestExe = Join-Path $PWD 'artifacts\InstaladorTests.exe'
          & $taskCompiler /nologo /target:exe /main:InstaladorTests /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll ("/out:" + $taskTestExe) (Join-Path $PWD 'packaging\Instalador.cs') (Join-Path $PWD 'tests\InstaladorTests.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar teste do instalador.' }
          & $taskTestExe
          if ($LASTEXITCODE -ne 0) { throw 'O perfil do instalador falhou nos testes.' }
      - name: Testar executavel com dados ficticios
        run: |
          $taskExe = Join-Path $PWD 'dist/ci/DeliveryBot.exe'
          $taskReport = Join-Path $PWD 'artifacts/executavel.json'
          $taskProcess = Start-Process -FilePath $taskExe -ArgumentList @('--smoke-test', ('"' + $taskReport + '"')) -WindowStyle Hidden -PassThru
          if (-not $taskProcess.WaitForExit(120000)) {
            Stop-Process -Id $taskProcess.Id -Force
            throw 'O teste do executavel excedeu dois minutos.'
          }
          if ($taskProcess.ExitCode -ne 0) { throw 'O teste do executavel falhou.' }
          $taskResult = Get-Content -LiteralPath $taskReport -Raw | ConvertFrom-Json
          if ($taskResult.ok -ne $true -or $taskResult.documentos_pdf -ne $true -or $taskResult.perfil_comercio -ne $true -or $taskResult.pedido_conversa -ne $true -or $taskResult.obsidian_visual -ne $true -or $taskResult.obsidian_graph -ne $true -or $taskResult.padroes_atendimento -ne $true -or $taskResult.minijogo -ne $true -or $taskResult.recuperacao_cerebro -ne $true) { throw 'Relatorio do executavel incompleto.' }
          Get-Content -LiteralPath $taskReport
      - name: Guardar relatorios de validacao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-windows
          path: |
            artifacts/testes.xml
            artifacts/executavel.json
            build/DeliveryBot/warn-DeliveryBot.txt
          retention-days: 7
          if-no-files-found: warn

  validacao:
    name: DeliveryBot / validacao obrigatoria
    if: always()
    needs: [codigo, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir sucesso de todas as verificacoes
        env:
          RESULTADO_CODIGO: ${{ needs.codigo.result }}
          RESULTADO_WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$RESULTADO_CODIGO" = success
          test "$RESULTADO_WINDOWS" = success
