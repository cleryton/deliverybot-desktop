<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link inválido</title>
<style>
  :root { --tinta:#f1f6f3; --pergaminho:#ffffff; --rum:#a53d3d; --carvao:#192d36; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--tinta);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 24px;
  }
  .card {
    background: var(--pergaminho); color: var(--carvao);
    border-radius: 18px; padding: 34px 26px; max-width: 420px; text-align: center;
    border-top: 4px solid var(--rum);
  }
  .icon { font-size: 2.6rem; }
  h1 { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 1.15rem; margin: 10px 0 10px; color: var(--rum); }
  p { color: #4a453a; line-height: 1.55; font-size: .92rem; }
  strong { color: var(--carvao); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Este link de pedido não está mais disponível</h1>
    <p>{{ mensagem }}</p>
    <p>Volte à conversa do WhatsApp e mande uma mensagem dizendo que quer fazer um pedido para gerar um novo link.</p>
  </div>
</body>
</html>
